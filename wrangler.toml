name = "ajarvisual-backend"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = [ "nodejs_compat" ]

[build]
command = 'cmd /C "set GOOS=wasip1&& set GOARCH=wasm&& go build -trimpath -ldflags="-s -w" -o main.wasm . && npx wasm-opt -Oz --all-features -o main.wasm main.wasm"'
watch_dir = "."
