name = "ajar-visual-backend"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = [ "nodejs_compat" ]

[build]
command = "node build.js"
watch_dir = "handlers"

[[d1_databases]]
binding = "DB"
database_name = "ajar-visual-db"
database_id = "e103f496-909b-4e4e-b520-e811257b3dfd"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ajarvisual"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
